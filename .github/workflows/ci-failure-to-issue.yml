name: CI failure → issue

# Boucle V5 (moitié « plomberie ») : quand la CI échoue sur `main`, ouvrir une
# issue `ai-fix` avec le lien du run et les jobs fautifs. La correction se fait
# ensuite en local avec Claude Code (`npm run ai-fix <n>`) ou, si
# `vars.AI_AUTOMATION_ENABLED == 'true'`, par le workflow `agent-fix`.
#
# Rien n'est créé pour les échecs de PR (bruit) — seulement `main`.
# NB : un workflow `workflow_run` s'exécute depuis la version du fichier sur la
# branche par défaut — il ne se déclenchera qu'une fois mergé sur `main`.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  open-issue:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir l'issue ai-fix (si pas déjà ouverte pour ce commit)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TITLE="ci: échec sur main (${SHORT_SHA})"

          if gh issue list --state open --label ai-fix --search "${SHORT_SHA}" \
               --json title --jq '.[].title' | grep -qF "${SHORT_SHA}"; then
            echo "Issue déjà ouverte pour ${SHORT_SHA}."
            exit 0
          fi

          gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion=="failure") | "- \(.name)"' > failed.txt || true
          [ -s failed.txt ] || echo "- (voir le run)" > failed.txt

          {
            echo "La CI a échoué sur \`main\` au commit \`${SHORT_SHA}\`."
            echo
            echo "**Run** : ${RUN_URL}"
            echo
            echo "**Jobs en échec :**"
            cat failed.txt
            echo
            echo "---"
            echo "## Pour corriger"
            echo
            echo "\`npm run ai-fix\` liste les issues \`ai-fix\` ; \`npm run ai-fix ${SHORT_SHA}\`"
            echo "(ou le numéro d'issue) prépare une branche + le contexte pour Claude Code."
            echo
            echo "La PR doit repartir verte (\`npm run validate\`) et, si c'est un \`fix:\`,"
            echo "ajouter un test de régression."
          } > body.md

          gh issue create --title "$TITLE" --label ai-fix --body-file body.md
