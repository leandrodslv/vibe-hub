name: Spike — audit de perf

# V8 : sur une PR `spike`, mesure le coût perf du spike (bundle gzip, build,
# dépendances) en comparant la branche à sa base, et commente le résultat.
# L'implémentation du spike se fait en local (`npm run explore -- "<objectif>"`
# puis Claude Code) ; ce workflow n'automatise que la mesure.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  perf-diff:
    if: contains(github.event.pull_request.labels.*.name, 'spike')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Référence (base de la PR)
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          npm ci --prefer-offline --no-audit
          node scripts/perf-diff.mjs --save

      - name: Après (tête de la PR)
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          npm ci --prefer-offline --no-audit
          node scripts/perf-diff.mjs || true

      - name: Commenter la PR
        if: hashFiles('reports/perf-diff.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/perf-diff.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body.startsWith('# Audit de perf — spike'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-diff
          path: reports/perf-*.json
          retention-days: 14
